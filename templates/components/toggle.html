{% comment %}
An on/off switch that submits its form. Put it inside a <form method="post">.
  {% include "components/toggle.html" with name="alerts_enabled" checked=search.alerts_enabled label="Alerts for this search" %}
It sends name=true when switching on and name=false when switching off.
{% endcomment %}<button type="submit" role="switch" aria-checked="{% if checked %}true{% else %}false{% endif %}" aria-label="{{ label }}" name="{{ name }}" value="{% if checked %}false{% else %}true{% endif %}" class="relative inline-flex h-6 w-11 shrink-0 items-center border-2 transition-colors {% if checked %}border-action-hover bg-action{% else %}border-line-strong bg-sunk{% endif %}"><span class="inline-block size-4 transition-transform {% if checked %}translate-x-5.5 bg-on-action{% else %}translate-x-0.5 bg-line-strong{% endif %}"></span></button>
