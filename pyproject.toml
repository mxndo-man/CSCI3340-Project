[project]
name = "csci3340-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Armando", email = "armando.san.2006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "taskipy>=1.14.1",
]


[tool.uv]
package = false

# To run this do 'uv run task dev'
[tool.taskipy.tasks]
sync = "uv sync"
makemigrations="uv run python manage.py makemigrations"
migrate = "uv run python manage.py migrate"
run = "uv run python manage.py runserver"
dev = "uv run task sync &&uv run task makemigrations &&uv run task migrate && uv run task run"
