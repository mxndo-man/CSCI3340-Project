{% extends "base.html" %}

{% block title %}Sign Up | My Project Workspace{% endblock %}

{% block content %}
<main class="mx-auto mt-8 w-full max-w-xl rounded-2xl bg-slate-800 p-8 shadow-lg">
    <h1 class="mb-6 text-2xl font-bold">Create an Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-4 rounded-lg bg-yellow-400 px-4 py-2 font-semibold text-slate-900 hover:bg-yellow-300">
            Create account
        </button>
    </form>
</main>
{% endblock %}
