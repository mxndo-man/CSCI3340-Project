{% extends "base.html" %}

{% block title %}Create a Board{% endblock %}

{% block content %}
<main class="mx-auto mt-8 w-full max-w-xl rounded-2xl bg-slate-800 p-8 shadow-lg">
    <a href="{% url 'boards:list' %}" class="text-sm hover:text-yellow-300">&larr; My Boards</a>
    <h1 class="mt-2 mb-6 text-2xl font-bold">Create a Board</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-4 rounded-lg bg-yellow-400 px-4 py-2 font-semibold text-slate-900 hover:bg-yellow-300">
            Create
        </button>
    </form>
</main>
{% endblock %}
